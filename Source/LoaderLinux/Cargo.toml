[workspace]
members = ["crates/ds2os-core", "crates/ds2os-dev"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ds2os-core = { path = "crates/ds2os-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }
png = "0.17"
evdev = "0.13"
x11rb = { version = "0.13", features = ["composite"] }
